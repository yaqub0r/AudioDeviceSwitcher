name: CI

on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '6.0.x'
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Test without changing host audio devices
        run: dotnet test test/AudioDeviceSwitcher.Tests.csproj -p:Platform=x64 -p:Configuration=Release --filter "FullyQualifiedName!~AudioPageViewModelTests" --logger trx --results-directory TestResults
      - name: Build Windows application
        run: msbuild src/AudioDeviceSwitcher/AudioDeviceSwitcher.csproj /restore /p:Platform=x64 /p:Configuration=Release /p:AppxPackageSigningEnabled=false /verbosity:minimal
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
